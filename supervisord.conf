[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

# ─────────────────────────────────────────────────────────────────────────────
# Priority 0: Run startup script FIRST
# Sets up KasmVNC config, password, directories, desktop settings
# ─────────────────────────────────────────────────────────────────────────────
[program:startup]
priority=0
command=bash -c '/app/scripts/start.sh && sleep infinity'
autostart=true
autorestart=false
startsecs=2
startretries=0
exitcodes=0,1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 1: PostgreSQL
# ─────────────────────────────────────────────────────────────────────────────
[program:postgresql]
priority=1
command=bash -c 'PG_VERSION=$(ls /etc/postgresql/ 2>/dev/null | head -1); if [ -n "$PG_VERSION" ]; then pg_ctlcluster $PG_VERSION main start; fi; sleep infinity'
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 2: KasmVNC web access
# KasmVNC's vncserver creates its own Xvnc display server
# No need for separate Xvfb — KasmVNC IS the display server
# Port 7860 is the web client port (HTTP)
# ─────────────────────────────────────────────────────────────────────────────
[program:kasmvnc]
priority=2
command=bash -c 'sleep 3 && vncserver :1 -geometry 1280x720 -depth 24 -websocketPort 7860 -interface 0.0.0.0 -httpPort 7860 && sleep infinity'
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 3: XFCE4 desktop session
# Starts on the display that KasmVNC created (:1)
# ─────────────────────────────────────────────────────────────────────────────
[program:xfce4]
priority=3
command=bash -c 'sleep 8 && DISPLAY=:1 xfce4-session'
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 4: Auto-sync loop
# ─────────────────────────────────────────────────────────────────────────────
[program:auto-sync]
priority=4
command=bash -c 'sleep 60 && bash /app/scripts/auto-sync.sh'
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
