[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

# ─────────────────────────────────────────────────────────────────────────────
# Priority 0: Run startup script FIRST
# Sets up KasmVNC password, directories, desktop settings
# ─────────────────────────────────────────────────────────────────────────────
[program:startup]
priority=0
command=bash -c '/app/scripts/start.sh && sleep infinity'
autostart=true
autorestart=false
startsecs=2
startretries=0
exitcodes=0,1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 1: PostgreSQL
# ─────────────────────────────────────────────────────────────────────────────
[program:postgresql]
priority=1
command=bash -c 'PG_VERSION=$(ls /etc/postgresql/ 2>/dev/null | head -1); if [ -n "$PG_VERSION" ]; then pg_ctlcluster $PG_VERSION main start; fi; sleep infinity'
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 2: KasmVNC web access on port 7860
# vncserver creates its own Xvnc display and starts the web server
# -select-de xfce tells it to use XFCE4
# -geometry and -depth set the display resolution
# After vncserver starts (daemonizes), we tail the log to keep the process running
# ─────────────────────────────────────────────────────────────────────────────
[program:kasmvnc]
priority=2
command=bash -c 'sleep 5 && kasmvncserver :1 -select-de xfce -geometry 1280x720 -depth 24 2>&1 && sleep 3 && tail -f /root/.vnc/*.log 2>/dev/null; sleep infinity'
autorestart=true
startsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 3: Auto-sync loop
# ─────────────────────────────────────────────────────────────────────────────
[program:auto-sync]
priority=3
command=bash -c 'sleep 120 && bash /app/scripts/auto-sync.sh'
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
