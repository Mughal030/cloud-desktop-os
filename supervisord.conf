[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

# ─────────────────────────────────────────────────────────────────────────────
# Priority 0: Run startup script FIRST
# Creates VNC password, KasmVNC config, directories, desktop settings
# ─────────────────────────────────────────────────────────────────────────────
[program:startup]
priority=0
command=bash -c '/app/scripts/start.sh && sleep infinity'
autostart=true
autorestart=false
startsecs=2
startretries=0
exitcodes=0,1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 1: PostgreSQL
# ─────────────────────────────────────────────────────────────────────────────
[program:postgresql]
priority=1
command=bash -c 'PG_VERSION=$(ls /etc/postgresql/ 2>/dev/null | head -1); if [ -n "$PG_VERSION" ]; then pg_ctlcluster $PG_VERSION main start; fi; sleep infinity'
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 2: Xvfb virtual display (needed for KasmVNC or noVNC fallback)
# ─────────────────────────────────────────────────────────────────────────────
[program:xvfb]
priority=2
command=Xvfb :1 -screen 0 1280x720x24 -nolisten tcp
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 3: KasmVNC server (primary) OR noVNC fallback
# KasmVNC provides its own HTTPS web server on port 7860
# If KasmVNC not installed, fall back to noVNC + desktop-server (x11vnc renamed)
# ─────────────────────────────────────────────────────────────────────────────
[program:desktop]
priority=3
command=bash -c 'sleep 3 && if command -v vncserver &> /dev/null; then echo "[INFO] Starting KasmVNC..." && vncserver :1 -geometry 1280x720 -depth 24 -websocketPort 7860 -interface 0.0.0.0 && sleep infinity; else echo "[INFO] KasmVNC not found, using noVNC fallback..." && /usr/bin/desktop-server -display :1 -rfbport 5900 -localhost -nopw -forever -shared -bg -o /tmp/desktop-server.log 2>&1 && /opt/noVNC/utils/websockify/run --web /opt/noVNC --wrap-mode=ignore 7860 localhost:5900; fi'
autorestart=true
startsecs=8
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 4: XFCE4 desktop session
# ─────────────────────────────────────────────────────────────────────────────
[program:xfce4]
priority=4
command=bash -c 'sleep 6 && DISPLAY=:1 xfce4-session'
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 5: Auto-sync loop
# ─────────────────────────────────────────────────────────────────────────────
[program:auto-sync]
priority=5
command=bash -c 'sleep 60 && bash /app/scripts/auto-sync.sh'
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
