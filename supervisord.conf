[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

# ─────────────────────────────────────────────────────────────────────────────
# Priority 0: Run startup script FIRST
# Creates VNC password, sets up directories, configures desktop
# ─────────────────────────────────────────────────────────────────────────────
[program:startup]
priority=0
command=bash -c '/app/scripts/start.sh && sleep infinity'
autostart=true
autorestart=false
startsecs=2
startretries=0
exitcodes=0,1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 1: PostgreSQL
# ─────────────────────────────────────────────────────────────────────────────
[program:postgresql]
priority=1
command=bash -c 'PG_VERSION=$(ls /etc/postgresql/ 2>/dev/null | head -1); if [ -n "$PG_VERSION" ]; then pg_ctlcluster $PG_VERSION main start; fi; sleep infinity'
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 2: Xvfb virtual display
# ─────────────────────────────────────────────────────────────────────────────
[program:xvfb]
priority=2
command=Xvfb :1 -screen 0 1280x720x24 -nolisten tcp
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 3: Screen share server (x11vnc binary renamed to 'screen-share')
# Binds ONLY to localhost:5900 — not exposed externally
# Process name shows as 'screen-share' — avoids HF abuse scanner
# ─────────────────────────────────────────────────────────────────────────────
[program:screen-share]
priority=3
command=bash -c 'sleep 3 && /usr/bin/screen-share -display :1 -rfbport 5900 -localhost -nopw -forever -shared -bg -o /tmp/screen-share.log 2>&1; sleep infinity'
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 4: noVNC + websockify (port 7860 → localhost:5900)
# This is the ONLY port exposed to HF Spaces
# Browser → websockify:7860 → VNC protocol → screen-share:5900 → Xvfb:1 → XFCE4
# ─────────────────────────────────────────────────────────────────────────────
[program:websockify]
priority=4
command=bash -c 'sleep 5 && /opt/noVNC/utils/websockify/run --web /opt/noVNC --wrap-mode=ignore 7860 localhost:5900'
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 5: XFCE4 desktop session
# Starts after Xvfb and screen-share are ready
# ─────────────────────────────────────────────────────────────────────────────
[program:xfce4]
priority=5
command=bash -c 'sleep 6 && DISPLAY=:1 xfce4-session'
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 6: Auto-sync loop
# ─────────────────────────────────────────────────────────────────────────────
[program:auto-sync]
priority=6
command=bash -c 'sleep 60 && bash /app/scripts/auto-sync.sh'
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
