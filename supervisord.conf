[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

# ─────────────────────────────────────────────────────────────────────────────
# Priority 0: Run startup script FIRST (creates password file, dirs, etc.)
# Then keep running as a lightweight monitor
# ─────────────────────────────────────────────────────────────────────────────
[program:startup]
priority=0
command=bash -c '/app/scripts/start.sh && sleep infinity'
autostart=true
autorestart=false
startsecs=2
startretries=0
exitcodes=0,1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 1: PostgreSQL
# ─────────────────────────────────────────────────────────────────────────────
[program:postgresql]
priority=1
command=bash -c 'PG_VERSION=$(ls /etc/postgresql/ 2>/dev/null | head -1); if [ -n "$PG_VERSION" ]; then pg_ctlcluster $PG_VERSION main start; fi; sleep infinity'
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 2: Xvfb virtual display
# ─────────────────────────────────────────────────────────────────────────────
[program:xvfb]
priority=2
command=Xvfb :1 -screen 0 1280x720x24 -nolisten tcp
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 3: Xpra screen forwarding (NOT VNC)
# xpra start creates a daemon by default; we use --daemon=no for foreground
# If --daemon=no doesn't work with this xpra version, fall back to:
#   start xpra daemon + tail the log file
# ─────────────────────────────────────────────────────────────────────────────
[program:xpra]
priority=3
command=bash -c 'sleep 5 && xpra start :1 --bind-tcp=0.0.0.0:14500 --html=on --start=xfce4-session --exit-with-children=no --daemon=no --video-encoders=none --audio=no --password-file=/root/.xpra/password --no-notifications --no-mdns --no-pulseaudio --socket-dir=/tmp --pidfile=/tmp/xpra.pid 2>&1 || (echo "[WARN] xpra --daemon=no failed, trying daemon mode..." && xpra start :1 --bind-tcp=0.0.0.0:14500 --html=on --start=xfce4-session --exit-with-children=no --video-encoders=none --audio=no --password-file=/root/.xpra/password --no-notifications --no-mdns --no-pulseaudio --socket-dir=/tmp --pidfile=/tmp/xpra.pid 2>&1 && tail -f /tmp/xpra.log 2>/dev/null || sleep infinity)'
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 4: Nginx reverse proxy (7860 → 14500)
# ─────────────────────────────────────────────────────────────────────────────
[program:nginx]
priority=4
command=bash -c 'sleep 10 && nginx -g "daemon off;"'
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 5: Auto-sync loop
# ─────────────────────────────────────────────────────────────────────────────
[program:auto-sync]
priority=5
command=bash -c 'sleep 60 && bash /app/scripts/auto-sync.sh'
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
