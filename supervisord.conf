[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

# ─────────────────────────────────────────────────────────────────────────────
# Priority 0: Run startup script FIRST
# Creates KasmVNC config, password, directories, desktop settings
# ─────────────────────────────────────────────────────────────────────────────
[program:startup]
priority=0
command=bash -c '/app/scripts/start.sh && sleep infinity'
autostart=true
autorestart=false
startsecs=2
startretries=0
exitcodes=0,1
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 1: PostgreSQL
# ─────────────────────────────────────────────────────────────────────────────
[program:postgresql]
priority=1
command=bash -c 'PG_VERSION=$(ls /etc/postgresql/ 2>/dev/null | head -1); if [ -n "$PG_VERSION" ]; then pg_ctlcluster $PG_VERSION main start; fi; sleep infinity'
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 2: KasmVNC server
# KasmVNC uses YAML config at ~/.vnc/kasmvnc.yaml (created by start.sh)
# The -select-de flag tells it which desktop environment to use
# vncserver daemonizes by default, so we tail the log to keep the process alive
# ─────────────────────────────────────────────────────────────────────────────
[program:kasmvnc]
priority=2
command=bash -c 'sleep 5 && vncserver :1 -select-de xfce -geometry 1280x720 -depth 24 2>&1 && sleep 5 && tail -f /root/.vnc/*.log 2>/dev/null; sleep infinity'
autorestart=true
startsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

# ─────────────────────────────────────────────────────────────────────────────
# Priority 3: Auto-sync loop
# ─────────────────────────────────────────────────────────────────────────────
[program:auto-sync]
priority=3
command=bash -c 'sleep 120 && bash /app/scripts/auto-sync.sh'
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
