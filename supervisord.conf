[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:postgresql]
priority=1
command=bash -c 'PG_VERSION=$(ls /etc/postgresql/ 2>/dev/null | head -1); if [ -n "$PG_VERSION" ]; then pg_ctlcluster $PG_VERSION main start; fi; sleep infinity'
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xvfb]
priority=2
command=Xvfb :1 -screen 0 1280x720x24 -nolisten tcp
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xpra]
priority=3
command=bash -c 'sleep 3 && xpra start :1 --bind-tcp=0.0.0.0:14500 --html=on --html-dir=/usr/share/xpra/www --start=xfce4-session --exit-with-children=no --daemon=no --video-encoders=none --audio=no --password-file=/root/.xpra/password --no-notifications --no-mdns --no-pulseaudio --socket-dir=/tmp'
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
priority=4
command=nginx -g "daemon off;"
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:auto-sync]
priority=5
command=bash /app/scripts/auto-sync.sh
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
