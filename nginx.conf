worker_processes 1;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;

    sendfile on;
    keepalive_timeout 65;

    # ─── Cloud Desktop OS — Nginx reverse proxy ───
    # Browser → Nginx (7860) → Xpra HTML5 (14500)

    server {
        listen 7860;
        server_name _;

        # Xpra HTML5 web client — main desktop access
        location / {
            proxy_pass http://127.0.0.1:14500;
            proxy_http_version 1.1;

            # WebSocket upgrade headers (critical for Xpra)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Extended timeouts for long desktop sessions
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering off for real-time screen updates
            proxy_buffering off;
            proxy_cache off;
        }

        # Health check endpoint
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
